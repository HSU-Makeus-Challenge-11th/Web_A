<!DOCTYPE html>     <!--최신 html 문서임을 브라우저에게 알림-->
<html lang="ko">    <!--문서의 최상위 요소. 언어를 한국어로 지정-->
<head>              <!--화면에 직접 보이지 않는 문서 정보를 담는 곳, ex) 제목,문자 인코딩-->
    <meta charset="UTF-8">
    <!--meta viewport : 모바일 화면에서도 페이지 너비를 올바르게 해석하도록 도움-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>나의 첫 웹 페이지</title>
</head>
<body>              <!--실제 화면에 표시할 콘텐츠를 담는 곳-->
    <h1>안녕하세요!</h1>
    <p>웹 개발을 시작합니다. umc 활동을 시작했어요!</p>
</body>
</body>
</html>
